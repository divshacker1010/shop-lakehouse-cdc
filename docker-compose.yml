services:
  postgres:
    image: postgres:16
    container_name: shop-postgres
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=4"
      - "-c"
      - "max_wal_senders=4"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  hive-metastore-db:
    image: postgres:16
    container_name: shop-hive-metastore-db
    environment:
      POSTGRES_DB: metastore_db
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hivepassword
    volumes:
      - hive-metastore-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: shop-kafka
    ports:
      - "9092:9092"
    environment:
      JDK_JAVA_OPTIONS: "-XX:UseSVE=0"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_LOG_RETENTION_HOURS: "72"
    volumes:
      - kafka-data:/tmp/kafka-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: shop-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      # JDK_JAVA_OPTIONS: "-XX:UseSVE=0"
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/subjects || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-connect:
    build:
      context: ./kafka-connect
    container_name: shop-kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_GROUP_ID: shop-connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_PLUGIN_PATH: /usr/share/confluent-hub-components
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.1.0
    container_name: shop-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      JDK_JAVA_OPTIONS: "-XX:UseSVE=0"
      KAFKA_CLUSTERS_0_NAME: shop-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: shop-connect-cluster
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    
  workload-generator:
    build:
      context: ./workload-generator
      dockerfile: Dockerfile
    container_name: shop-workload-generator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: shop
      DB_USER: postgres
      DB_PASSWORD: postgres
      MIN_SLEEP_SECONDS: "5"
      MAX_SLEEP_SECONDS: "10"

  spark:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: shop-spark
    user: root
    depends_on:
      kafka:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy
    ports:
      - "4040:4040"
    volumes:
      - ./spark-jobs:/opt/spark-jobs
      - spark-checkpoints:/tmp/spark-checkpoints
    command: >
      /opt/spark/bin/spark-submit
      --conf spark.jars.ivy=/tmp/.ivy2
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.apache.spark:spark-avro_2.12:3.5.1,io.delta:delta-spark_2.12:3.2.0,org.apache.hadoop:hadoop-aws:3.3.4
      --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
      --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
      --conf spark.sql.hive.metastore.version=3.1.3
      --conf spark.sql.hive.metastore.jars=maven
      --conf spark.sql.catalogImplementation=hive
      --conf spark.hadoop.hive.metastore.uris=thrift://hive-metastore:9083
      --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000
      --conf spark.hadoop.fs.s3a.access.key=minioadmin
      --conf spark.hadoop.fs.s3a.secret.key=minioadmin123
      --conf spark.hadoop.fs.s3a.path.style.access=true
      --conf spark.hadoop.fs.s3a.connection.ssl.enabled=false
      --conf spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
      /opt/spark-jobs/06_delta_write.py

  spark-batch:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: shop-spark-batch
    user: root
    profiles: ["batch"]
    volumes:
      - ./spark-jobs:/opt/spark-jobs
    command: >
      /opt/spark/bin/spark-submit
      --conf spark.jars.ivy=/tmp/.ivy2
      --packages io.delta:delta-spark_2.12:3.2.0,org.apache.hadoop:hadoop-aws:3.3.4
      --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
      --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
      --conf spark.sql.hive.metastore.version=3.1.3
      --conf spark.sql.hive.metastore.jars=maven
      --conf spark.sql.catalogImplementation=hive
      --conf spark.hadoop.hive.metastore.uris=thrift://hive-metastore:9083
      --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000
      --conf spark.hadoop.fs.s3a.access.key=minioadmin
      --conf spark.hadoop.fs.s3a.secret.key=minioadmin123
      --conf spark.hadoop.fs.s3a.path.style.access=true
      --conf spark.hadoop.fs.s3a.connection.ssl.enabled=false
      --conf spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
      /opt/spark-jobs/07_backfill_current_tables.py

  spark-ondemand:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: shop-spark-ondemand
    user: root
    profiles: ["batch"]
    volumes:
      - ./spark-jobs:/opt/spark-jobs
    command: ["/bin/true"]
      
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: shop-minio
    ports:
      - "9090:9000"
      - "9091:9091"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9091"
  
  hive-metastore:
    build:
      context: ./hive-metastore
      dockerfile: Dockerfile
    container_name: shop-hive-metastore
    depends_on:
      hive-metastore-db:
        condition: service_healthy
    ports:
      - "9083:9083"
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      # schema already initialized in the volume; entrypoint reruns -initSchema
      # unconditionally otherwise and fails with "already exists". Set back to
      # false (or unset) only when the hive-metastore-db-data volume is wiped.
      IS_RESUME: "true"
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-db:5432/metastore_db
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hivepassword
    volumes:
      - hive-warehouse:/opt/hive/data/warehouse
    healthcheck:
      # schema init is slow under amd64 emulation on arm64 hosts, hence the long start_period
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9083' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
  
  trino:
    image: trinodb/trino:latest
    container_name: shop-trino
    depends_on:
      hive-metastore:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "8082:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog

volumes:
  pgdata:
  spark-checkpoints:
  minio-data:
  kafka-data:
  hive-metastore-db-data:
  hive-warehouse:

# Compose's auto-generated default network name (<project>_default) contains an
# underscore, which java.net.URI rejects when Hive canonicalizes the metastore
# hostname (thrift://<container>.<network>) -> explicit hyphenated name avoids that.
networks:
  default:
    name: shop-network



